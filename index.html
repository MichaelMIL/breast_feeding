<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feeding Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fdf6f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      color: #3a2a1e;
    }

    /* ── header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 380px;
      justify-content: space-between;
    }
    h1 { font-size: 1.4rem; font-weight: 600; color: #7a4a2e; }

    .gear-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.3rem;
      padding: 4px 8px;
      border-radius: 8px;
      opacity: 0.6;
      transition: opacity 0.15s, background 0.15s;
    }
    .gear-btn:hover { opacity: 1; background: #f0e8e0; }

    /* ── timer ── */
    .timer-section {
      background: #fff;
      border-radius: 16px;
      padding: 14px 28px;
      margin-bottom: 24px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      min-width: 240px;
    }
    .timer-label { font-size: 0.78rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
    .timer-side  { font-size: 0.92rem; font-weight: 600; color: #c0724a; margin-bottom: 2px; }
    .timer-display { font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #3a2a1e; }
    .timer-display.done    { color: #c0724a; }
    .timer-display.running { color: #2d7a4a; }

    /* ── section label ── */
    .section-label {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: #b09080;
      margin-bottom: 10px; align-self: flex-start; padding-left: 4px;
    }

    /* ── button rows ── */
    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 360px;
    }
    .btn-row { display: flex; gap: 28px; align-items: flex-end; }

    .breast-wrap, .pump-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }

    /* nursing buttons */
    .breast-btn {
      width: 150px; height: 138px;
      border: none; cursor: pointer; background: none; padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s, filter 0.12s;
      filter: drop-shadow(0 7px 22px rgba(0,0,0,0.22));
    }
    .breast-btn:active { transform: scale(0.90); filter: drop-shadow(0 2px 7px rgba(0,0,0,0.13)); }
    .breast-btn svg { display: block; }

    /* pump buttons */
    .pump-btn {
      width: 118px; height: 128px;
      border: none; cursor: pointer; background: none; padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s, filter 0.12s;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,0.20));
    }
    .pump-btn:active { transform: scale(0.90); filter: drop-shadow(0 2px 6px rgba(0,0,0,0.11)); }
    .pump-btn svg { display: block; }

    .btn-label { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .breast-wrap.left  .btn-label { color: #c0507a; }
    .breast-wrap.right .btn-label { color: #4a80c0; }
    .pump-wrap.left    .btn-label { color: #9060b0; }
    .pump-wrap.right   .btn-label { color: #3d8a60; }

    hr.divider { width: 100%; max-width: 360px; border: none; border-top: 1.5px dashed #ead8cc; margin: 4px 0 20px; }

    /* ── history ── */
    .history-section { width: 100%; max-width: 380px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .history-title { font-size: 0.95rem; font-weight: 600; color: #7a4a2e; }
    .clear-btn { font-size: 0.75rem; color: #bbb; background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .clear-btn:hover { background: #f0e8e0; color: #c0724a; }
    .export-btn { font-size: 0.75rem; color: #7a8aa0; background: none; border: 1.5px solid #d0dce8; cursor: pointer; padding: 4px 10px; border-radius: 6px; font-weight: 600; }
    .export-btn:hover { background: #eef4fa; border-color: #4a80c0; color: #4a80c0; }
    .history-actions { display: flex; gap: 8px; align-items: center; }
    .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 48vh; overflow-y: auto; }
    .history-item { background: #fff; border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); font-size: 0.9rem; }
    .history-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .history-dot.left       { background: #e07ba0; }
    .history-dot.right      { background: #7ab8e0; }
    .history-dot.pump-left  { background: #b080d0; }
    .history-dot.pump-right { background: #50a878; }
    .history-type { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; padding: 2px 6px; border-radius: 6px; flex-shrink: 0; }
    .history-type.feed { background: #fde8f0; color: #c0507a; }
    .history-type.pump { background: #ede8f8; color: #8050b0; }
    .history-side { font-weight: 600; flex: 0 0 38px; font-size: 0.88rem; }
    .history-side.left       { color: #c0507a; }
    .history-side.right      { color: #4a80c0; }
    .history-side.pump-left  { color: #9060b0; }
    .history-side.pump-right { color: #3d8a60; }
    .history-time { color: #888; font-size: 0.82rem; margin-left: auto; white-space: nowrap; }
    .empty-state { text-align: center; color: #bbb; font-size: 0.9rem; padding: 24px 0; }

    /* ── settings modal ── */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(30,15,8,0.45);
      backdrop-filter: blur(3px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 20px;
      padding: 28px 28px 24px;
      width: 300px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    }
    .modal h2 { font-size: 1.1rem; color: #7a4a2e; margin-bottom: 20px; }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .setting-row label { font-size: 0.9rem; color: #5a3a2e; font-weight: 500; }
    .setting-row .val-wrap {
      display: flex; align-items: center; gap: 6px;
    }
    .setting-row input[type=number] {
      width: 62px; padding: 6px 8px; border: 1.5px solid #e0c8b8;
      border-radius: 8px; font-size: 1rem; text-align: center;
      color: #3a2a1e; background: #fdf6f0; outline: none;
    }
    .setting-row input[type=number]:focus { border-color: #c0724a; }
    .setting-row .unit { font-size: 0.8rem; color: #999; }

    .modal-btns { display: flex; gap: 10px; margin-top: 22px; }
    .modal-btns button {
      flex: 1; padding: 10px; border: none; border-radius: 10px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    .btn-save   { background: #c0724a; color: #fff; }
    .btn-cancel { background: #f0e8e0; color: #7a4a2e; }
    .btn-save:hover, .btn-cancel:hover { opacity: 0.85; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Feeding Tracker</h1>
    <button class="gear-btn" onclick="openSettings()" aria-label="Settings">⚙️</button>
  </div>

            <ellipse cx="80" cy="128" rx="58" ry="14" fill="rgba(100,50,30,0.12)"/>

            <circle cx="60" cy="54" r="10.5" fill="none" stroke="rgba(195,148,255,0.42)" stroke-width="1.5"/>
            <ellipse cx="56.5" cy="50.5" rx="4" ry="3" fill="#fff" opacity="0.11"/>

                <stop offset="28%"  stop-color="#80d0a0"/>

            <circle cx="60" cy="54" r="30" fill="none" stroke="rgba(150,230,185,0.60)" stroke-width="2.8"/>
            <circle cx="60" cy="54" r="10.5" fill="rgba(0,10,4,0.94)"/>
            <circle cx="60" cy="54" r="10.5" fill="none" stroke="rgba(120,220,160,0.42)" stroke-width="1.5"/>

  <!-- History -->
  <div class="history-section">
    <div class="history-header">
      <span class="history-title">History</span>
      <div class="history-actions">
        <button class="export-btn" onclick="exportCSV()">↓ Export CSV</button>
        <button class="clear-btn"  onclick="clearHistory()">Clear all</button>
      </div>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- Settings modal -->
  <div class="overlay" id="overlay" onclick="closeSettings()">
    <div class="modal" onclick="event.stopPropagation()">
      <h2>Timer Settings</h2>

      <div class="setting-row">
        <label>Nursing timer</label>
        <div class="val-wrap">
          <input type="number" id="cfgFeed" min="1" max="180" value="20"/>
          <span class="unit">min</span>
        </div>
      </div>

      <div class="setting-row">
        <label>Pumping timer</label>
        <div class="val-wrap">
          <input type="number" id="cfgPump" min="1" max="60" value="5"/>
          <span class="unit">min</span>
        </div>
      </div>

      <div class="modal-btns">
        <button class="btn-save"   onclick="saveSettings()">Save</button>
        <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
      </div>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'feedingLog';
  const TIMER_KEY   = 'feedingTimer';
  const CFG_KEY     = 'feedingConfig';

  let timerInterval = null;
  let audioCtx = null;
  let chimePlayed = false;

  function unlockAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // iOS requires playing a real (silent) buffer inside the user-gesture call
    // to fully unlock the context for later async playback
    const buf = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(0);
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playChime() {
    if (!audioCtx) return;
    // resume() in case the browser suspended the context while in background
    audioCtx.resume().then(() => {
      // Three ascending notes: A4 → C#5 → E5 (gentle major arpeggio)
      [[440, 0], [554, 0.28], [659, 0.56]].forEach(([freq, delay]) => {
        const osc  = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        const t = audioCtx.currentTime + delay;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.28, t + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
        osc.start(t);
        osc.stop(t + 1.4);
      });
    });
  }

  function getConfig() {
    const saved = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
    return {
      feedMins: saved.feedMins ?? 20,
      pumpMins: saved.pumpMins ?? 5,
    };
  }

  function durationFor(type) {
    const cfg = getConfig();
    return (type === 'pump' ? cfg.pumpMins : cfg.feedMins) * 60 * 1000;
  }

  function getLog() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }

  function record(side, type) {
    unlockAudio();
    chimePlayed = false;
    const entries = getLog();
    entries.unshift({ side, type, time: Date.now() });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    localStorage.setItem(TIMER_KEY, JSON.stringify({ side, type, start: Date.now() }));
    renderHistory();
    startTimer();
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(tick, 500);
    tick();
  }

  function tick() {
    const raw = localStorage.getItem(TIMER_KEY);
    if (!raw) { resetTimerUI(); return; }
    const { side, type, start } = JSON.parse(raw);
    const remaining = durationFor(type) - (Date.now() - start);

    const sideLabel = side.charAt(0).toUpperCase() + side.slice(1);
    const typeLabel = type === 'pump' ? 'Pumped' : 'Fed';
    document.getElementById('timerSide').textContent = `Last: ${typeLabel} ${sideLabel}`;

    const dispEl = document.getElementById('timerDisplay');
    if (remaining <= 0) {
      if (!chimePlayed) { chimePlayed = true; playChime(); }
      dispEl.textContent = 'Feed now!';
      dispEl.className = 'timer-display done';
    } else {
      const mins = Math.floor(remaining / 60000);
      const secs = Math.floor((remaining % 60000) / 1000);
      dispEl.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
      dispEl.className = 'timer-display running';
    }
  }

  function resetTimerUI() {
    document.getElementById('timerSide').textContent = '—';
    const d = document.getElementById('timerDisplay');
    d.textContent = '—'; d.className = 'timer-display';
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    const entries = getLog();
    if (entries.length === 0) {
      list.innerHTML = '<div class="empty-state">No sessions logged yet</div>';
      return;
    }
    list.innerHTML = entries.map(e => {
      const d    = new Date(e.time);
      const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const date = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      const type = e.type || 'feed';
      const dotClass  = type === 'pump' ? `pump-${e.side}` : e.side;
      const sideClass = type === 'pump' ? `pump-${e.side}` : e.side;
      const sideLabel = e.side.charAt(0).toUpperCase() + e.side.slice(1);
      const typeLabel = type === 'pump' ? 'Pump' : 'Feed';
      return `<div class="history-item">
        <div class="history-dot ${dotClass}"></div>
        <span class="history-type ${type}">${typeLabel}</span>
        <span class="history-side ${sideClass}">${sideLabel}</span>
        <span>${date}</span>
        <span class="history-time">${time}</span>
      </div>`;
    }).join('');
  }

  function exportCSV() {
    const entries = getLog();
    if (entries.length === 0) { alert('No data to export.'); return; }
    const rows = [['Date', 'Time', 'Type', 'Side', 'Unix Timestamp']];
    entries.forEach(e => {
      const d    = new Date(e.time);
      const date = d.toLocaleDateString([], { year: 'numeric', month: '2-digit', day: '2-digit' });
      const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const type = (e.type || 'feed').charAt(0).toUpperCase() + (e.type || 'feed').slice(1);
      const side = e.side.charAt(0).toUpperCase() + e.side.slice(1);
      rows.push([date, time, type, side, e.time]);
    });
    const csv  = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `feeding-log-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function clearHistory() {
    if (!confirm('Clear all history?')) return;
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(TIMER_KEY);
    if (timerInterval) clearInterval(timerInterval);
    resetTimerUI();
    renderHistory();
  }

  // Settings
  function openSettings() {
    const cfg = getConfig();
    document.getElementById('cfgFeed').value = cfg.feedMins;
    document.getElementById('cfgPump').value = cfg.pumpMins;
    document.getElementById('overlay').classList.add('open');
  }
  function closeSettings() {
    document.getElementById('overlay').classList.remove('open');
  }
  function saveSettings() {
    const feedMins = Math.max(1, parseInt(document.getElementById('cfgFeed').value) || 20);
    const pumpMins = Math.max(1, parseInt(document.getElementById('cfgPump').value) || 5);
    localStorage.setItem(CFG_KEY, JSON.stringify({ feedMins, pumpMins }));
    closeSettings();
  }

  // Init
  renderHistory();
  const savedTimer = localStorage.getItem(TIMER_KEY);
  if (savedTimer) {
    const { type, start } = JSON.parse(savedTimer);
    if (durationFor(type) - (Date.now() - start) <= 0) chimePlayed = true;
    startTimer();
  }
</script>
</body>
</html>
